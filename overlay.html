<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Archipelago Auto-Overlay V2</title>
    <style>
        body { margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; background: transparent; font-family: 'Segoe UI', sans-serif; overflow: hidden; box-sizing: border-box; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; flex-grow: 1; align-content: start; }
        
        .video-box { background: rgba(17, 17, 27, 0.9); border: 3px solid #45475a; border-radius: 12px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: border-color 0.3s, box-shadow 0.3s; }
        
        /* Classe ajoutée dynamiquement quand un joueur trouve un objet */
        .video-box.highlight { border-color: #f9e2af; box-shadow: 0 0 25px #f9e2af; }
        
        .video-header { background: #313244; color: #cdd6f4; padding: 8px 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { height: 10px; width: 10px; background-color: #f38ba8; border-radius: 50%; display: inline-block; transition: 0.3s; }
        .status-dot.online { background-color: #a6e3a1; box-shadow: 0 0 8px #a6e3a1; }
        
        .iframe-container { width: 100%; aspect-ratio: 16 / 9; background: #11111b; }
        iframe { width: 100%; height: 100%; border: none; }

        .log-container { position: absolute; bottom: 20px; left: 20px; width: 450px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        .log-entry { background: rgba(24, 24, 37, 0.95); color: #cdd6f4; padding: 10px 15px; border-left: 4px solid #89b4fa; border-radius: 4px; font-size: 14px; text-shadow: 1px 1px 2px black; animation: slideIn 0.3s ease-out; opacity: 1; transition: opacity 1s; }
        
        #deathlink-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 0, 0, 0.4); border: 15px solid red; z-index: 100; display: none; justify-content: center; align-items: center; pointer-events: none; box-sizing: border-box; }
        #deathlink-overlay h1 { color: white; font-size: 80px; text-shadow: 0 0 20px red; text-transform: uppercase; font-weight: 900; letter-spacing: 5px; }

        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes flash { 0% { opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="deathlink-overlay"><h1>DEATHLINK !</h1></div>
    <div class="grid" id="video-grid"></div>
    <div class="log-container" id="log-box"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');
        if (!encodedData) throw new Error("No data");

        const config = JSON.parse(decodeURIComponent(atob(encodedData)));
        const grid = document.getElementById('video-grid');
        const logBox = document.getElementById('log-box');
        
        // --- AUDIO (Sons libres de droits Google) ---
        const sfxItem = new Audio('https://actions.google.com/sounds/v1/cartoon/magic_chime.ogg');
        const sfxDeath = new Audio('https://actions.google.com/sounds/v1/alarms/spaceship_alarm.ogg');
        sfxItem.volume = 0.5;
        sfxDeath.volume = 0.6;

        function playSound(type) {
            if (!config.sounds) return;
            if (type === 'item') { sfxItem.currentTime = 0; sfxItem.play().catch(()=>{}); }
            if (type === 'death') { sfxDeath.currentTime = 0; sfxDeath.play().catch(()=>{}); }
        }

        // --- GÉNÉRATION VIDÉO ---
        function sanitizeId(name) { return 'p-' + name.replace(/[^a-zA-Z0-9]/g, '-'); }

        function getIframeSrc(link) {
            if (!link) return null;
            if (link.includes('twitch.tv')) {
                const channel = link.split('/').pop().split('?')[0];
                return `https://player.twitch.tv/?channel=${channel}&parent=${window.location.hostname || 'localhost'}&muted=true`;
            }
            if (link.includes('youtube.com') || link.includes('youtu.be')) {
                let id = link.includes('v=') ? link.split('v=')[1].split('&')[0] : link.split('/').pop();
                return `https://www.youtube.com/embed/${id}?autoplay=1&controls=0&mute=1`;
            }
            return link;
        }

        config.players.forEach(player => {
            if(!player.name) return;
            const imgSrc = getIframeSrc(player.link);
            const content = imgSrc 
                ? `<iframe src="${imgSrc}" allow="autoplay"></iframe>` 
                : `<div style="display:flex; height:100%; align-items:center; justify-content:center; color:#585b70;">Pas de flux vidéo</div>`;
            
            const playerId = sanitizeId(player.name);
            grid.innerHTML += `
                <div class="video-box" id="box-${playerId}">
                    <div class="video-header">
                        <span>${player.name}</span>
                        <span class="status-dot" id="status-${playerId}"></span>
                    </div>
                    <div class="iframe-container">${content}</div>
                </div>
            `;
        });

        // --- LOG ET ANIMATIONS ---
        function addLog(message, color = "#89b4fa") {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.borderLeftColor = color;
            entry.innerHTML = message;
            logBox.appendChild(entry);
            setTimeout(() => { entry.style.opacity = "0"; setTimeout(() => entry.remove(), 1000); }, 10000);
        }

        function highlightPlayer(playerName) {
            const box = document.getElementById(`box-${sanitizeId(playerName)}`);
            if (box) {
                box.classList.add('highlight');
                setTimeout(() => box.classList.remove('highlight'), 4000);
            }
        }

        function triggerDeathLink() {
            playSound('death');
            const dl = document.getElementById('deathlink-overlay');
            dl.style.display = 'flex';
            dl.style.animation = 'flash 4s ease-out forwards';
            setTimeout(() => { dl.style.display = 'none'; dl.style.animation = ''; }, 4000);
        }

        // --- WEBSOCKET AP AVEC RECONNEXION AUTO ---
        let ws;
        let reconnectTimeout;

        function connectAP() {
            if (!config.server || !config.slot) return;
            const wsURL = config.server.startsWith('ws') ? config.server : `wss://${config.server}`;
            ws = new WebSocket(wsURL);

            ws.onopen = () => {
                addLog("🟢 Connecté au serveur Archipelago", "#a6e3a1");
                clearTimeout(reconnectTimeout);
                ws.send(JSON.stringify([{
                    cmd: 'Connect', password: '', name: config.slot,
                    version: { major: 0, minor: 4, build: 4, class: 'Version' },
                    tags: ['Tracker', 'DeathLink'], items_handling: 0
                }]));
            };

            ws.onmessage = (event) => {
                const packets = JSON.parse(event.data);
                packets.forEach(packet => {
                    // Chat et Objets
                    if (packet.cmd === 'PrintJSON') {
                        let textMessage = "";
                        if(packet.data) packet.data.forEach(part => { textMessage += part.text || ""; });
                        else if (packet.text) textMessage = packet.text;
                        
                        if(textMessage && !textMessage.startsWith("Connection")) {
                            let isItem = textMessage.includes("found") || textMessage.includes("sent");
                            addLog(textMessage, isItem ? "#f9e2af" : "#bac2de");
                            
                            // Détection basique de qui a trouvé l'objet pour l'animation
                            if (isItem) {
                                playSound('item');
                                config.players.forEach(p => {
                                    if (textMessage.includes(p.name)) highlightPlayer(p.name);
                                });
                            }
                        }
                    }
                    // DeathLink
                    if (packet.cmd === 'Bounced' && packet.tags && packet.tags.includes('DeathLink')) {
                        const source = packet.data ? packet.data.source : "Quelqu'un";
                        addLog(`💀 <b>${source}</b> a déclenché un DeathLink !`, "#f38ba8");
                        triggerDeathLink();
                    }
                });
            };

            ws.onclose = () => {
                addLog("🔴 Déconnecté. Reconnexion dans 5s...", "#f38ba8");
                reconnectTimeout = setTimeout(connectAP, 5000);
            };

            ws.onerror = () => { ws.close(); }; // Force onclose
        }

        connectAP();
    </script>
</body>
</html>

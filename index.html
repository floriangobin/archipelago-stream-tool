<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Archipelago - Control Panel V3</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="panel-mode">
<div class="container">
    <h1>🎮 AP Stream Setup V3</h1>
    
    <div class="section">
        <h2>1. Serveur & Options</h2>
        <label>Serveur Archipelago</label>
        <input type="text" id="ap-server" placeholder="archipelago.gg:38281">
        <label>Ton pseudo en jeu (Slot Name)</label>
        <input type="text" id="ap-slot" placeholder="MonPseudo">
        <label style="margin-top:15px;"><input type="checkbox" id="enable-sounds" checked> Activer les effets sonores</label>
    </div>

    <div class="section">
        <h2>2. Personnalisation (Design)</h2>
        <div style="display: flex; gap: 20px;">
            <div style="flex:1;">
                <label>Couleur Principale (Bordures)</label>
                <input type="color" id="color-accent" value="#89b4fa">
            </div>
            <div style="flex:1;">
                <label>Couleur des Objets (Tracker)</label>
                <input type="color" id="color-item" value="#f9e2af">
            </div>
        </div>
    </div>

    <div class="section" id="players-section">
        <h2>3. Vidéos des Joueurs</h2>
        <div id="players-list"></div>
        <button class="btn-add" onclick="addPlayer()">+ Ajouter un joueur</button>
    </div>

    <button onclick="generateLink()">Générer le lien magique OBS</button>

    <div class="section" style="margin-top: 20px;">
        <h2>Lien OBS (1920x1080)</h2>
        <textarea id="obs-link" readonly placeholder="Cliquez sur Générer..."></textarea>
    </div>
</div>
<script src="js/panel.js"></script>
</body>
</html>

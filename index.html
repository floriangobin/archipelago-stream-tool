<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Archipelago - Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: auto; background: #313244; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #89b4fa; }
        .section { background: #181825; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #45475a; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #a6e3a1; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; background: #11111b; border: 1px solid #585b70; color: #cdd6f4; border-radius: 4px; box-sizing: border-box; }
        button { background: #89b4fa; color: #11111b; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #74c7ec; }
        .btn-add { background: #a6e3a1; margin-top: 10px; width: auto; }
        .player-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
        .player-row input { margin-top: 0; }
        textarea { width: 100%; height: 80px; margin-top: 10px; background: #11111b; color: #f38ba8; border: 1px solid #585b70; border-radius: 4px; padding: 10px; font-family: monospace; resize: none; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 AP Stream Overlay Setup</h1>
    
    <div class="section">
        <h2>1. Connexion au Serveur</h2>
        <label>Serveur Archipelago (ex: archipelago.gg:38281)</label>
        <input type="text" id="ap-server" placeholder="archipelago.gg:38281" required>
        <label>Ton pseudo en jeu (Slot Name)</label>
        <input type="text" id="ap-slot" placeholder="MonPseudo" required>
    </div>

    <div class="section" id="players-section">
        <h2>2. Vidéos des Joueurs (Amis)</h2>
        <p style="font-size: 0.9em; color: #bac2de;">Laissez le lien vide pour ne pas afficher de vidéo. Twitch, YouTube et VDO.Ninja sont supportés.</p>
        <div id="players-list">
            <!-- Les joueurs s'ajouteront ici -->
        </div>
        <button class="btn-add" onclick="addPlayer()">+ Ajouter un joueur</button>
    </div>

    <button onclick="generateLink()">Générer le lien magique OBS</button>

    <div class="section" style="margin-top: 20px;">
        <h2>3. URL à coller dans la Source Navigateur OBS</h2>
        <p style="font-size: 0.9em; color: #bac2de;">Dimensions recommandées : 1920x1080</p>
        <textarea id="obs-link" readonly placeholder="Le lien apparaîtra ici..."></textarea>
    </div>
</div>

<script>
    // Ajoute un joueur par défaut au chargement
    window.onload = () => addPlayer();

    function addPlayer() {
        const div = document.createElement('div');
        div.className = 'player-row';
        div.innerHTML = `
            <input type="text" placeholder="Pseudo" class="p-name">
            <input type="text" placeholder="Lien (Twitch, VDO...)" class="p-link">
            <button onclick="this.parentElement.remove()" style="margin:0; width:auto; background:#f38ba8;">X</button>
        `;
        document.getElementById('players-list').appendChild(div);
    }

    function generateLink() {
        const server = document.getElementById('ap-server').value.replace('wss://', '');
        const slot = document.getElementById('ap-slot').value;
        
        const players = [];
        document.querySelectorAll('.player-row').forEach(row => {
            const name = row.querySelector('.p-name').value;
            const link = row.querySelector('.p-link').value;
            if (name) players.push({ name, link });
        });

        // Création d'un objet de configuration complet
        const config = { server, slot, players };
        
        // On encode l'objet en Base64
        const encodedConfig = btoa(encodeURIComponent(JSON.stringify(config)));
        
        // CORRECTION : Détection robuste de l'URL pour GitHub Pages
        let urlBase = window.location.href.split('?')[0]; // Enlève les paramètres au cas où
        if (!urlBase.includes('index.html')) {
            if (!urlBase.endsWith('/')) urlBase += '/';
            urlBase += 'overlay.html';
        } else {
            urlBase = urlBase.replace('index.html', 'overlay.html');
        }
        
        const lienFinal = `${urlBase}?data=${encodedConfig}`;
        document.getElementById('obs-link').value = lienFinal;
    }
</script>

</body>
</html>

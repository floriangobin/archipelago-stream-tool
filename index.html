<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Archipelago - Studio V5</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Importation de polices Google -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="panel-mode">

    <div class="controls-sidebar">
        <h2>🎨 AP Studio V5</h2>
        
        <div class="section">
            <label>Serveur Archipelago</label>
            <input type="text" id="ap-server" placeholder="archipelago.gg:38281" oninput="debouncePreview()">
            <label>Ton Pseudo (Slot Name)</label>
            <input type="text" id="ap-slot" placeholder="Pseudo" oninput="debouncePreview()">
        </div>

        <div class="section">
            <h3>Apparence & Layout</h3>
            <label>Style d'agencement (Layout)</label>
            <select id="ui-layout" onchange="updatePreview()">
                <option value="layout-grid">Grille Classique</option>
                <option value="layout-side">Héros (1 Grand, liste sur le côté)</option>
                <option value="layout-minimal">Minimaliste (Sans bordures)</option>
            </select>

            <div class="row-2">
                <div>
                    <label>Police d'écriture</label>
                    <select id="ui-font" onchange="updatePreview()">
                        <option value="'Segoe UI', sans-serif">Moderne (Défaut)</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                        <option value="'Press Start 2P', cursive">Pixel Art (Rétro)</option>
                    </select>
                </div>
                <div>
                    <label>Arrondi (Pixels)</label>
                    <input type="number" id="ui-radius" value="12" min="0" max="50" oninput="debouncePreview()">
                </div>
            </div>

            <div class="row-2" style="margin-top: 10px;">
                <div>
                    <label>Couleur Principale</label>
                    <input type="color" id="color-accent" value="#89b4fa" onchange="updatePreview()">
                </div>
                <div>
                    <label>Couleur Objets</label>
                    <input type="color" id="color-item" value="#f9e2af" onchange="updatePreview()">
                </div>
            </div>

            <label>Image de fond (URL optionnelle pour OBS)</label>
            <input type="text" id="ui-bg" placeholder="https://lien-image.png" oninput="debouncePreview()">
        </div>

        <div class="section">
            <h3>Modules</h3>
            <div class="toggle-row"><span>🔊 Sons</span><label class="switch"><input type="checkbox" id="opt-sounds" checked onchange="updatePreview()"><span class="slider"></span></label></div>
            <div class="toggle-row"><span>📝 Log Texte</span><label class="switch"><input type="checkbox" id="opt-log" checked onchange="updatePreview()"><span class="slider"></span></label></div>
            <div class="toggle-row"><span>🎬 Auto-Focus</span><label class="switch"><input type="checkbox" id="opt-focus" checked onchange="updatePreview()"><span class="slider"></span></label></div>
            <div class="toggle-row"><span>🔍 Indices (HUD)</span><label class="switch"><input type="checkbox" id="opt-hints" checked onchange="updatePreview()"><span class="slider"></span></label></div>
            <div class="toggle-row"><span>💀 DeathLink</span><label class="switch"><input type="checkbox" id="opt-deathlink" checked onchange="updatePreview()"><span class="slider"></span></label></div>
        </div>

        <div class="section" id="players-section">
            <h3>Joueurs & Flux Vidéos</h3>
            <div id="players-list"></div>
            <button class="btn-success" onclick="addPlayer(); updatePreview();">+ Ajouter Joueur</button>
        </div>

        <div class="section">
            <label>Lien OBS (1920x1080)</label>
            <textarea id="obs-link" readonly onclick="this.select()"></textarea>
            <button onclick="shareConfig()">🤝 Copier le lien coopératif</button>
        </div>
    </div>

    <div class="preview-area">
        <h3 style="margin:0; color:var(--text);">📺 Rendu en direct</h3>
        <div class="preview-container"><iframe id="preview-frame"></iframe></div>
    </div>

    <script src="js/panel.js"></script>
</body>
</html>
